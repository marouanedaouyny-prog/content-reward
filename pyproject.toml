[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content-reward"
version = "0.1.0"
description = "Local-first Content Rewards clipping, validation and review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "yt-dlp[default]==2026.8.19",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
transcription = ["faster-whisper==1.0.3", "requests>=2.31,<3"]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.23,<2", "httpx>=0.27,<1", "ruff==0.16.0"]

[project.scripts]
content-reward = "clipping.__main__:main"

[tool.setuptools.packages.find]
include = ["clipping*", "app*", "campaigns*", "publishing*", "analytics*", "config*"]
exclude = ["legacy*", "tests*"]

[tool.setuptools.package-data]
clipping = ["*.html", "*.js", "examples/*.srt"]
config = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["legacy", ".venv", ".workflow-tests", "storage", "data", "clips"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
extend-exclude = ["legacy", ".workflow-tests", ".venv", "storage", "data"]

[tool.ruff.lint]
select = ["E9", "F"]
