services:
  clipping-api:
    build:
      context: .
      dockerfile: Dockerfile.clipping
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CLIPPING_DATABASE: /app/data/clipping.db
      CLIPPING_STORAGE: /app/storage/clipping
      WHISPER_MODEL: "${WHISPER_MODEL:-}"
      KILL_SWITCH: ${KILL_SWITCH:-false}
      DRY_RUN: ${DRY_RUN:-false}
      CLIPPING_AUTOMATION: "${CLIPPING_AUTOMATION:-}"
      CLIPPING_TREND_AGENT: "${CLIPPING_TREND_AGENT:-true}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      TREND_REGION: "${TREND_REGION:-US}"
      TREND_LANGUAGE: "${TREND_LANGUAGE:-en}"
      INSTAGRAM_ACCESS_TOKEN: "${INSTAGRAM_ACCESS_TOKEN:-}"
      INSTAGRAM_ACCOUNT_ID: "${INSTAGRAM_ACCOUNT_ID:-}"
      INSTAGRAM_GRAPH_VERSION: "${INSTAGRAM_GRAPH_VERSION:-}"
      INSTAGRAM_APP_ID: "${INSTAGRAM_APP_ID:-}"
      INSTAGRAM_APP_SECRET: "${INSTAGRAM_APP_SECRET:-}"
      INSTAGRAM_REDIRECT_URI: "${INSTAGRAM_REDIRECT_URI:-}"
    volumes:
      - ./data:/app/data
      - ./storage/clipping:/app/storage/clipping
    restart: unless-stopped
