id: product_research
version: 1.0.0
name: Product Research Pipeline
risk_level: medium
permissions:
  - browser
  - filesystem
retries:
  max_attempts: 3
  backoff_seconds: [30, 120, 600]
approval:
  submit: required
timeouts:
  step_timeout_seconds: 300
  overall_timeout_seconds: 86400
  browser_timeout_seconds: 120
idempotency_strategy:
  key_prefix: product_research_{{workflow_id}}
  cache_store: redis_or_sqlite
  deduplicate_on: input_hash
manual_approval_rules:
  - action: submit
    condition: always_required
    gate: submission_approval
cost_tracking:
  estimated_cost: 0
  billing_status: free_tier_or_local
  provider: local_or_ollama
  model: local_model
  requests_today: 0
  tokens_today: 0
steps:
  - worker: product_scan
    payload:
      scan_type: "marketplace"
      target_sites: []
      categories: []
      max_products: 100
  - worker: product_report
    payload:
      report_format: "markdown"